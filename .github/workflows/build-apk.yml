name: Perps Bot APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # ubuntu-latest içinde Android SDK hazır geliyor
      - name: Android SDK lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK derle
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK'yı hazırla
        run: cp app/build/outputs/apk/release/app-release.apk PerpsBot.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PerpsBot-APK
          path: PerpsBot.apk

      - name: Sürüm yayınla (telefondan indirmek için)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Perps Bot v1.0.${{ github.run_number }}
          body: |
            Telefonundan **PerpsBot.apk** dosyasına dokunup indir ve kur.
            Kağıt mod: gerçek fiyatlar, sanal 1000$ bakiye. Gerçek para kullanılmaz.
          files: PerpsBot.apk
